{% load static %}
<header id="site-header">
    <div class="header-container">
        <a href="{% url 'core:home' %}" id="brand-logo">
            <img src="{% static 'images/kaapool_logo.png' %}" alt="Kaapool Logo" class="brand-logo-img">
        </a>

        <button class="mobile-menu-toggle" id="mobile-toggle-btn" aria-label="Toggle navigation menu">
            <i class="fa-solid fa-bars"></i>
        </button>

        <div class="nav-menu-wrapper" id="nav-menu-wrapper">
            <nav id="main-nav">
                <ul class="nav-links">
                    <li><a href="{% url 'rides:search' %}" class="nav-link">Find a ride</a></li>
                    <li><a href="{% url 'rides:create' %}" class="nav-link">Offer a ride</a></li>
                    <li><a href="{% url 'core:safety' %}" class="nav-link">Safety</a></li>
                    <li><a href="{% url 'core:how_it_works' %}" class="nav-link">How it works</a></li>
                </ul>
            </nav>

            <div class="header-actions">
                {% if user.is_authenticated %}
                {% include 'components/user_menu.html' %}
                {% else %}
                <div class="auth-btn-group">
                    <a href="{% url 'accounts:login' %}" class="btn-login-nav">Login</a>
                    <a href="{% url 'accounts:signup' %}" class="btn-signup-nav">Sign up</a>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</header>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const toggleBtn = document.getElementById('mobile-toggle-btn');
        const navMenu = document.getElementById('nav-menu-wrapper');
        
        if (toggleBtn) {
            toggleBtn.addEventListener('click', function() {
                navMenu.classList.toggle('active');
                const icon = toggleBtn.querySelector('i');
                if (navMenu.classList.contains('active')) {
                    icon.classList.remove('fa-bars');
                    icon.classList.add('fa-xmark');
                } else {
                    icon.classList.remove('fa-xmark');
                    icon.classList.add('fa-bars');
                }
            });
        }
    });
</script>
