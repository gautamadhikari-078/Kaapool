<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Expired or Invalid - Kaapool Super Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 16px;
            padding: 2.75rem 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .icon-badge {
            width: 64px;
            height: 64px;
            background: #fee2e2;
            color: #dc2626;
            border: 2px solid #fecaca;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 1.25rem;
        }
        .brand-title {
            font-size: 1.45rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 0.75rem;
        }
        .card-text {
            font-size: 0.92rem;
            color: #475569;
            line-height: 1.6;
            margin-bottom: 1.75rem;
        }
        .btn-submit {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.85rem;
            background: #f89516;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background: #e0830d;
        }
        .card-footer-link {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.25rem;
            border-top: 1px solid #f1f5f9;
            font-size: 0.875rem;
            color: #64748b;
        }
        .card-footer-link a {
            color: #f89516;
            font-weight: 700;
            text-decoration: none;
        }
        .card-footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="icon-badge">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h1 class="brand-title">Link Expired or Invalid</h1>
        <p class="card-text">
            This password reset link is invalid or has already expired. Reset links can only be used once for security reasons.
        </p>

        <a href="{% url 'admin_panel:password_reset' %}" class="btn-submit">
            Request New Reset Link <i class="fa-solid fa-rotate-right"></i>
        </a>

        <div class="card-footer-link">
            Return to <a href="{% url 'admin_panel:login' %}">Admin Sign In</a>
        </div>
    </div>
</body>
</html>
