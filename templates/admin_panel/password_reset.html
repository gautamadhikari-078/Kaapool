<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Password Reset - Kaapool Super Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .brand-logo {
            width: 56px;
            height: 56px;
            background: #fff3e6;
            color: #f89516;
            border: 2px solid #fed7aa;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin-bottom: 0.75rem;
        }
        .brand-title {
            font-size: 1.45rem;
            font-weight: 800;
            color: #0f172a;
        }
        .brand-subtitle {
            font-size: 0.875rem;
            color: #64748b;
            margin-top: 0.35rem;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.5rem;
        }
        .input-wrapper {
            position: relative;
        }
        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }
        .form-input:focus {
            border-color: #f89516;
            box-shadow: 0 0 0 3px rgba(248, 149, 22, 0.15);
        }
        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background: #f89516;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-submit:hover {
            background: #e0830d;
        }
        .alert-box {
            padding: 0.75rem 1rem;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .card-footer-link {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.25rem;
            border-top: 1px solid #f1f5f9;
            font-size: 0.875rem;
            color: #64748b;
        }
        .card-footer-link a {
            color: #f89516;
            font-weight: 700;
            text-decoration: none;
        }
        .card-footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-header">
            <div class="brand-logo"><i class="fa-solid fa-key"></i></div>
            <h1 class="brand-title">Reset Admin Password</h1>
            <p class="brand-subtitle">Enter your admin username or email and we will send you a secure link to reset your credentials.</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert-box">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span>{{ message }}</span>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'admin_panel:password_reset' %}">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Admin Username or Email</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input type="text" name="identity" class="form-input" placeholder="admin or admin@kaapool.com" required autofocus>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                Send Reset Link <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>

        <div class="card-footer-link">
            Remembered your password? <a href="{% url 'admin_panel:login' %}">Back to Sign In</a>
        </div>
    </div>
</body>
</html>
